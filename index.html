<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 这一行非常重要，确保在手机端也能正常缩放显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    
    <!-- 引入 Tailwind CSS 框架（这就是页面变好看的魔法） -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Font Awesome 图标库，用于显示 GitHub 等图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 引入好看的英文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- 自定义一点小样式 -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* 柔和的背景渐变色 */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh; /* 撑满全屏高度 */
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- 主容器：限制最大宽度，水平居中，内部左右布局（大屏幕左右，小屏幕上下） -->
    <div class="container mx-auto px-6 max-w-5xl">
        
        <!-- 介绍区域卡片（使用白色半透明毛玻璃效果） -->
        <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl overflow-hidden p-8 md:p-12 flex flex-col md:flex-row items-center gap-10">
            
            <!-- 左侧：文字介绍区 -->
            <div class="flex-1 text-center md:text-left">
                <!-- 小标签 -->
                <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-600 text-sm font-semibold mb-4">
                    你好，很高兴认识你 👋
                </span>
                
                <!-- 你的名字（主标题） -->
                <!-- ⚠️ 替换为你自己的名字 -->
                <h1 class="text-5xl font-extrabold text-gray-800 tracking-tight mb-4">
                    我是 <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">你的名字</span>
                </h1>
                
                <!-- 个人标语（副标题） -->
                <!-- ⚠️ 替换为你的专业或一句话介绍 -->
                <p class="text-xl text-gray-600 mb-6 font-medium">
                    计算机科学专业学生 / 全栈开发爱好者
                </p>
                
                <!-- 详细介绍 -->
                <!-- ⚠️ 替换为你的真实介绍 -->
                <p class="text-gray-500 leading-relaxed mb-8">
                    目前就读于 XXX 大学。我对 Web 开发和人工智能充满热情，喜欢用代码解决实际问题。平时喜欢逛 GitHub，偶尔写写博客。
                </p>
                
                <!-- 按钮组 -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                    <!-- 核心按钮：查看作品 -->
                    <a href="#projects" class="px-8 py-3 rounded-full bg-blue-600 text-white font-semibold shadow-lg hover:bg-blue-700 hover:shadow-blue-500/30 hover:-translate-y-1 transition-all duration-300">
                        查看我的作品
                    </a>
                    
                    <!-- 次要按钮：下载简历（你可以传个 pdf 到仓库里，把链接填在这） -->
                    <a href="#" class="px-8 py-3 rounded-full bg-white text-gray-700 font-semibold border border-gray-200 shadow-sm hover:bg-gray-50 hover:-translate-y-1 transition-all duration-300">
                        <i class="fa-solid fa-download mr-2"></i>下载简历
                    </a>
                </div>

                <!-- 社交链接图标 -->
                <div class="mt-10 flex gap-5 justify-center md:justify-start text-2xl text-gray-400">
                    <!-- ⚠️ 把 href 里的 # 换成你的真实 GitHub 链接 -->
                    <a href="#" class="hover:text-gray-900 hover:-translate-y-1 transition-transform duration-300" title="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <!-- ⚠️ 把 href 里的 # 换成 mailto:你的邮箱 -->
                    <a href="#" class="hover:text-blue-600 hover:-translate-y-1 transition-transform duration-300" title="Email">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                    <!-- ⚠️ 如果你有微信或微博，也可以加在这里 -->
                    <a href="#" class="hover:text-green-500 hover:-translate-y-1 transition-transform duration-300" title="WeChat">
                        <i class="fa-brands fa-weixin"></i>
                    </a>
                </div>
            </div>

            <!-- 右侧：头像展示区 -->
            <div class="flex-1 flex justify-center md:justify-end">
                <!-- 头像外圈动效 -->
                <div class="relative w-64 h-64 md:w-80 md:h-80">
                    <!-- 装饰性背景圈 -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-blue-400 to-purple-400 rounded-full blur-2xl opacity-30 animate-pulse"></div>
                    
                    <!-- ⚠️ 真实的头像图片：请把 src 里的链接换成你自己的图片地址。
                         如果你暂时没有，可以把这张图片传到你的 GitHub 仓库里，然后填相对路径（比如 src="./avatar.jpg"） -->
                    <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?q=80&w=800&auto=format&fit=crop" 
                         alt="我的头像" 
                         class="relative rounded-full w-full h-full object-cover border-4 border-white shadow-2xl hover:scale-105 transition-transform duration-500">
                </div>
            </div>

        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio | 练有达</title>
    
    <!-- Dependencies: Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Dependencies: Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Dependencies: Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Custom Styles: 扩展 Tailwind 主题或覆盖默认样式 -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* 设定全局背景渐变 */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center antialiased">

    <!-- Main Layout Container: 控制最大宽度并实现水平居中 -->
    <main class="container mx-auto px-6 max-w-5xl">
        
        <!-- Hero Section Card: 包含磨砂玻璃效果与响应式 Flex 布局 -->
        <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl overflow-hidden p-8 md:p-12 flex flex-col md:flex-row items-center gap-10">
            
            <!-- Left Column: 文本信息与 CTA (Call to Action) -->
            <div class="flex-1 text-center md:text-left">
                <!-- Badge: 欢迎状态标签 -->
                <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-600 text-sm font-semibold mb-4">
                    Hello World 👋
                </span>
                
                <!-- [TODO: 替换姓名] 主标题: 使用 clip-text 实现文本渐变效果 -->
                <h1 class="text-5xl font-extrabold text-gray-800 tracking-tight mb-4">
                    我是 <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">练有达</span>
                </h1>
                
                <!-- [TODO: 替换专业/方向] 副标题: 字体加粗，突出职业定位 -->
                <p class="text-xl text-gray-600 mb-6 font-medium">
                    上海交通大学 物理学
                </p>
                
                <!-- [TODO: 替换个人简介] 正文: 限制行高 (leading-relaxed) 提升可读性 -->
                <p class="text-gray-500 leading-relaxed mb-8">
                    广东河源人。皇室战争 2v2 名人堂，王者荣耀星耀玩家。
                </p> <p>
                    工作经历：<br>
                    2020 - 2023      广州市铁一中学 教研处 教学助理       导师：张恒主任 <br>
                    2023 - 2026      广州市铁一中学 教研处 教学助理       导师：颜璜主任
                </p>
                
                <!-- CTA Buttons: 包含 Hover 态过渡动画 (transition-all) -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                    <!-- [TODO: 替换简历链接] Secondary Button: 次要操作 -->
                    <a href="https://mp.weixin.qq.com/s/MayfySsT5ljZ61j7mAb1bg" class="px-8 py-3 rounded-full bg-white text-gray-700 font-semibold border border-gray-200 shadow-sm hover:bg-gray-50 hover:-translate-y-1 transition-all duration-300">
                        <i class="fa-solid fa-download mr-2"></i>下载简历
                    </a>
                </div>
            </div>

            <!-- Right Column: 视觉元素 (头像) -->
            <div class="flex-1 flex justify-center md:justify-end">
                <!-- Avatar Wrapper: 相对定位，用于包含背景光晕 -->
                <div class="relative w-64 h-64 md:w-80 md:h-80">
                    <!-- 背景光晕装饰: 使用 blur 和 pulse 动画 -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-blue-400 to-purple-400 rounded-full blur-2xl opacity-30 animate-pulse"></div>
                    
                    <!-- [TODO: 替换头像路径 (建议使用本地相对路径如 ./avatar.jpg)] -->
                    <!-- Image Element: object-cover 确保图片不变形 -->
                    <img src="https://mmbiz.qpic.cn/sz_mmbiz_jpg/03GvOicc4HUOC90AQxWJeibFic0Cibt6vCaKp8agDnZctOXO3SuEhcjhm1P6Zdiakwje3ZPibFglp6LmvrOqJ51wicQEjibowjicBvZRMm2icmqfKFDuI/640?wx_fmt=jpeg&tp=webp&wxfrom=5&wx_lazy=1#imgIndex=10" 
                         alt="Avatar Profile" 
                         class="relative rounded-full w-full h-full object-cover border-4 border-white shadow-2xl hover:scale-105 transition-transform duration-500">
                </div>
            </div>

        </div>
    </main>

</body>
</html>

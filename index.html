<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2020ak91's Blog</title>

  <!-- ================= 外部资源引入 ================= -->
  <!-- 1. KaTeX 公式样式与脚本 (必须先引入) -->
  <link rel="stylesheet" href="./katex/katex.min.css">
  <script src="./katex/katex.min.js"></script>
  
  <!-- 2. 博客全局样式 -->
  <link rel="stylesheet" href="./style.css">
  
  <!-- 3. 独立的 Markdown 渲染引擎 -->
  <script src="./markdown-parser.js"></script>
</head>

<body>

  <!-- ================= 顶部导航 ================= -->
  <header class="site-header">
    <nav class="nav container">
      <span class="logo" id="navHome">2020ak91's Blog</span>
      <ul class="nav-links">
        <li><button class="nav-btn" id="navList" type="button">首页</button></li>
        <li><a href="editor.html" target="_blank" class="nav-btn">写作台 ↗</a></li>
        <li>
          <button id="themeToggle" class="theme-toggle" type="button"
                  aria-label="切换深色/浅色主题">🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">

    <div class="notice">
      📌 本站文章通过纯静态读取仓库中的 <code>posts.json</code> 加载。如需发布新文章，请前往“写作台”。
    </div>

    <!-- ================= 视图一：文章列表 ================= -->
    <section id="view-list">
      <div class="list-head">
        <h2 class="section-title">全部文章</h2>
      </div>

      <div id="postList" class="post-list"></div>

      <!-- 空状态 -->
      <div id="emptyState" class="empty hidden">
        <p>还没有文章，开始写第一篇吧。</p>
        <a href="editor.html" target="_blank" class="btn btn-primary" style="text-decoration: none;">前往写作台 ↗</a>
      </div>
    </section>

    <!-- ================= 视图二：阅读文章 ================= -->
    <section id="view-read" class="hidden">
      <button class="btn btn-small btn-ghost js-back" type="button">← 返回列表</button>
      <article class="read-article">
        <h1 id="readTitle"></h1>
        <div id="readMeta" class="post-meta"></div>
        <div id="readContent" class="prose"></div>
      </article>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 2020ak91's Blog </p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ================= 核心业务逻辑 ================= -->
  <script>
    // 保留一个简单的转义函数，用于列表卡片的数据安全
    function escapeHtml(str = '') {
      return String(str).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    const $  = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

    let toastTimer = null;
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    /* ================= 数据层 ================= */
    let posts = [];
    let currentId = null;

    async function loadPosts() {
      try {
        const res = await fetch('posts.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          posts = data;
        }
      } catch (err) {
        console.warn('读取 posts.json 失败：', err);
        toast('读取失败：请确保仓库有 posts.json，且通过 http 访问（不要直接双击 html）');
        posts = [];
      }
    }

    function sortedPosts() {
      return [...posts].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    }

    /* ================= 渲染层 ================= */
    function makeExcerpt(content = '', max = 110) {
      const text = content
        .replace(/\$\$[\s\S]*?\$\$/g, ' [公式] ')
        .replace(/\$([^\$\n]+)\$/g, ' [公式] ')
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
        .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
        .replace(/[#>*_`~\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return text.length > max ? text.slice(0, max) + '…' : text;
    }

    function renderList() {
      const listEl  = $('#postList');
      const emptyEl = $('#emptyState');
      listEl.innerHTML = '';

      const items = sortedPosts();
      if (items.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');

      items.forEach(post => {
        const card = document.createElement('article');
        card.className = 'post-card';
        card.innerHTML = `
          <div class="post-meta">
            <time datetime="${escapeHtml(post.date)}">${escapeHtml(post.date || '未标注日期')}</time>
            ${(post.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          <h3>${escapeHtml(post.title || '无标题')}</h3>
          <p>${escapeHtml(makeExcerpt(post.content))}</p>
          <div class="post-actions">
            <button class="btn btn-small btn-primary" data-action="read" data-id="${escapeHtml(post.id)}">阅读</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function showView(name) {
      ['list', 'read'].forEach(v => {
        $('#view-' + v).classList.toggle('hidden', v !== name);
      });
      window.scrollTo(0, 0);
    }

    function openPost(id) {
      const post = posts.find(p => p.id === id);
      if (!post) return;
      currentId = id;

      $('#readTitle').textContent = post.title || '无标题';
      $('#readMeta').innerHTML =
        `<time datetime="${escapeHtml(post.date)}">${escapeHtml(post.date || '')}</time>` +
        (post.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('');
      
      // 核心改变：调用外部的 window.BlogMarkdown.render
      $('#readContent').innerHTML = window.BlogMarkdown.render(post.content || '');

      showView('read');
    }

    /* ================= 事件绑定 ================= */
    $('#postList').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      if (action === 'read') openPost(id);
    });

    $('#navHome').addEventListener('click', () => showView('list'));
    $('#navList').addEventListener('click', () => showView('list'));

    $$('.js-back').forEach(btn => {
      btn.addEventListener('click', () => showView('list'));
    });

    /* ================= 主题切换 ================= */
    const root = document.documentElement;
    const themeBtn = $('#themeToggle');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

    const savedTheme = localStorage.getItem('theme');
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(savedTheme || (systemDark ? 'dark' : 'light'));

    themeBtn.addEventListener('click', () => {
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* ================= 启动 ================= */
    (async function init() {
      $('#year').textContent = new Date().getFullYear();
      await loadPosts(); 
      renderList();
      showView('list');
    })();
  </script>
</body>
</html>

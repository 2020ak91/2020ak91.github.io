<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写作台 · 博客后台</title>
  <style>
    /* ... 样式和之前一样，保持不变 ... */
    :root { --bg: #f6f7f9; --panel-bg: #ffffff; --text: #1f2328; --text-soft: #656d76; --border: #d0d7de; --accent: #2563eb; --accent-hover: #1d4ed8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 16px;}
    h1 a { font-size: 0.9rem; font-weight: normal; color: var(--accent); text-decoration: none; }
    h1 a:hover { text-decoration: underline; }
    .layout { display: flex; gap: 16px; flex: 1; min-height: 0; }
    @media (max-width: 800px) { .layout { flex-direction: column; } }
    .panel { flex: 1; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-soft); }
    input, textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 0.9rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 150px; flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.5; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 8px 16px; border: 1px solid var(--border); background: var(--panel-bg); color: var(--text); border-radius: 6px; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button:hover { background: #f3f4f6; }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    pre { margin: 0; padding: 12px; background: #0d1117; color: #e6edf3; border-radius: 6px; overflow: auto; flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
    .hint { font-size: 0.8rem; color: var(--text-soft); margin-top: -6px; }
    .status { font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; }
    .status.success { background: #dcfce7; color: #166534; }
    .status.error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <header>
    <h1>📝 写作台 <a href="index.html">← 返回博客首页</a></h1>
    <div>
      <span id="loadStatus" class="status">正在读取仓库数据...</span>
      <label class="btn-group" style="margin: 0; display: inline-flex;">
        <button type="button" onclick="document.getElementById('jsonFileInput').click()">手动导入 JSON</button>
        <input type="file" id="jsonFileInput" accept=".json" hidden onchange="importJson(this)">
      </label>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧输入区 -->
    <div class="panel">
      <div class="row">
        <div class="form-group">
          <label>标题（留空则自动从正文提取）</label>
          <input type="text" id="postTitle" placeholder="文章标题">
        </div>
        <div class="form-group">
          <label>发布日期</label>
          <input type="date" id="postDate">
        </div>
      </div>
      <div class="form-group">
        <label>标签（逗号分隔）</label>
        <input type="text" id="postTags" placeholder="例如：前端, GitHub">
      </div>
      <div class="form-group" style="flex: 1; display: flex; flex-direction: column;">
        <label>Markdown 正文</label>
        <div class="hint">直接粘贴你的 Markdown 文本，工具会自动帮你转义。</div>
        <textarea id="postContent" placeholder="# 欢迎\n\n这是正文内容..."></textarea>
      </div>
    </div>

    <!-- 右侧输出区 -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <label>生成的 JSON <span id="modeText" style="color: var(--accent);">(加载中...)</span></label>
        <div class="btn-group" style="margin-top: 0;">
          <button class="primary" onclick="downloadJson()">下载覆盖 posts.json</button>
          <button onclick="copyJson()">复制 JSON</button>
        </div>
      </div>
      <pre><code id="outputJson">// 等待数据...</code></pre>
    </div>
  </div>

  <script>
    let existingPostsArray = null; 

    // 初始化日期
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('postDate').value = `${yyyy}-${mm}-${dd}`;

    // 监听输入
    ['postTitle', 'postDate', 'postTags', 'postContent'].forEach(id => {
      document.getElementById(id).addEventListener('input', generateJson);
    });

    // 自动获取仓库里的 posts.json
    async function autoLoadPosts() {
      const statusEl = document.getElementById('loadStatus');
      try {
        // 加时间戳防止浏览器缓存
        const res = await fetch('posts.json?t=' + Date.now());
        if (!res.ok) throw new Error('文件不存在或网络错误');
        const data = await res.json();
        
        if (Array.isArray(data)) {
          existingPostsArray = data;
          statusEl.textContent = `✅ 已自动加载 ${data.length} 篇文章`;
          statusEl.className = 'status success';
        } else {
          throw new Error('posts.json 格式不是数组');
        }
      } catch (err) {
        console.warn('自动加载失败:', err);
        statusEl.textContent = '⚠️ 自动加载失败，请手动导入';
        statusEl.className = 'status error';
      } finally {
        generateJson();
      }
    }

    function genId() {
      return 'post-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
    }

    function extractTitle(text) {
      const match = text.match(/^\s*#\s+(.+?)\s*$/m);
      return match ? match[1].trim() : '未命名文章';
    }

    function generateJson() {
      const titleInput = document.getElementById('postTitle').value.trim();
      const date = document.getElementById('postDate').value;
      const tagsRaw = document.getElementById('postTags').value.trim();
      const content = document.getElementById('postContent').value;

      if (!titleInput && !content.trim()) {
        document.getElementById('outputJson').textContent = '// 在左侧输入内容后，这里会实时生成 JSON...';
        return;
      }

      const tags = tagsRaw ? tagsRaw.split(/[,，\s]+/).filter(Boolean) : [];
      const title = titleInput || extractTitle(content);

      const newPost = {
        id: genId(),
        title: title,
        date: date,
        tags: tags,
        content: content
      };

      let finalOutput;
      if (existingPostsArray) {
        // 如果有历史数据，合并进去（新文章始终在最前面）
        const tempArray = [newPost, ...existingPostsArray];
        finalOutput = tempArray;
        document.getElementById('modeText').textContent = `(完整数组, 共 ${tempArray.length} 篇)`;
      } else {
        finalOutput = newPost;
        document.getElementById('modeText').textContent = '(单篇对象)';
      }

      document.getElementById('outputJson').textContent = JSON.stringify(finalOutput, null, 2);
    }

    function copyJson() {
      const text = document.getElementById('outputJson').textContent;
      if (text.startsWith('//')) return;
      navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板！'));
    }

    function downloadJson() {
      const text = document.getElementById('outputJson').textContent;
      if (text.startsWith('//')) return;
      const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'posts.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importJson(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            existingPostsArray = data;
            document.getElementById('loadStatus').textContent = `✅ 手动导入 ${data.length} 篇`;
            document.getElementById('loadStatus').className = 'status success';
            generateJson();
          } else {
            alert('导入失败：格式不正确');
          }
        } catch (err) {
          alert('解析失败：不是有效的 JSON');
        } finally {
          input.value = '';
        }
      };
      reader.readAsText(file);
    }

    // 页面加载时自动触发读取
    autoLoadPosts();
  </script>
</body>
</html>
